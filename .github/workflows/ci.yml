name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # MinVer needs full tag history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Print environment
        run: |
          dotnet --info
          docker --version
          docker compose version

      - name: Restore
        run: dotnet restore

      # SEC-05 (Phase 18-05): Static egress + air-gap gate.
      # Two checks enforce the invariant that no GameKit source file phones home or bypasses
      # the egress allow-list by constructing an unwrapped HttpClient directly.
      #
      # Check 1 — bare HttpClient construction in src/
      #   Scans src/**/*.cs for 'new HttpClient(' lines that are not:
      #   (a) commented out,
      #   (b) inside the egress-handler wiring files (EgressAllowListHandler.cs,
      #       AppleBuilderExtensions.cs, GoogleBuilderExtensions.cs) which legitimately
      #       create an HttpClientHandler as the DelegatingHandler's inner handler, or
      #   (c) IHttpClientFactory / AddHttpClient named-client paths (already egress-wrapped).
      #   A match fails the build — a new bare unwrapped client in src/ is a security gap.
      #
      # Check 2 — SaaS OTLP / telemetry endpoint in src/ or samples/
      #   Scans for hardcoded SaaS telemetry destination strings (case-insensitive).
      #   Matches fail the build — any hardcoded phone-home endpoint breaks the air-gap.
      #   Commented-out lines are excluded (they document rejected approaches, not live usage).
      #   NOTE: The literal patterns below are the canonical location for these strings.
      #   Do NOT add them elsewhere in source comments or docs to avoid triggering the grep.
      - name: Static egress + air-gap gate (SEC-05)
        run: |
          set -euo pipefail

          # --- Check 1: no bare HttpClient construction in src/ ---
          # Egress-handler wiring in the three files below legitimately construct an HttpClientHandler
          # (as the InnerHandler for DelegatingHandler); those files are explicitly excluded.
          BARE_CLIENT=$(grep -rn "new HttpClient(" src/ --include="*.cs" 2>/dev/null \
            | grep -v "/obj/" \
            | grep -v "//.*new HttpClient" \
            | grep -v "EgressAllowListHandler.cs" \
            | grep -v "AppleBuilderExtensions.cs" \
            | grep -v "GoogleBuilderExtensions.cs" \
            | grep -v "AddHttpClient\|IHttpClientFactory" \
            || true)
          if [ -n "$BARE_CLIENT" ]; then
            echo "ERROR: bare 'new HttpClient(' found in src/ — route through EgressAllowListHandler:" >&2
            echo "$BARE_CLIENT" >&2
            exit 1
          fi
          echo "Check 1 passed: no bare HttpClient construction in src/"

          # --- Check 2: no SaaS telemetry endpoint string in src/ or samples/ ---
          # Scans for hardcoded SaaS collector hostnames that indicate phone-home to a
          # third-party managed observability service. These are the patterns we ban:
          #   honeycomb.io  — Honeycomb SaaS telemetry
          #   datadoghq.com — Datadog SaaS telemetry
          #   newrelic.com  — New Relic SaaS telemetry
          #   grafana.net / grafana-cloud — Grafana Cloud managed service
          #   lightstep.com — Lightstep SaaS telemetry (now ServiceNow Cloud Observability)
          # NOT banned: "otlp", "otelcol", "otel-collector" — those refer to the
          # open-source self-hosted OpenTelemetry Collector which GameKit legitimately uses
          # in the sample app's docker-compose observability stack (self-hosted, no phone-home).
          SAAS_TELEMETRY=$(grep -rniE "honeycomb\.io|datadoghq\.com|newrelic\.com|grafana-cloud|grafana\.net|lightstep\.com" \
            src/ samples/ --include="*.cs" --include="*.yml" --include="*.yaml" --include="*.json" 2>/dev/null \
            | grep -v "/obj/" \
            | grep -v "^\s*//" \
            | grep -v "^[^:]*:#" \
            || true)
          if [ -n "$SAAS_TELEMETRY" ]; then
            echo "ERROR: SaaS telemetry endpoint string found in src/ or samples/ — air-gap broken:" >&2
            echo "$SAAS_TELEMETRY" >&2
            exit 1
          fi
          echo "Check 2 passed: no SaaS telemetry endpoint strings in src/ or samples/"

      # SEC-07 (Phase 18-01): Explicit supply-chain gate — fail the build if any HIGH or
      # CRITICAL CVE is present in the transitive dependency graph. This is a layered
      # secondary defense; the primary gate is NuGetAuditMode=all + NuGetAuditLevel=high
      # in Directory.Build.props (which already makes dotnet restore + build fail on advisory).
      # Running this step explicitly ensures the vulnerability list is visible in CI logs
      # and satisfies ROADMAP Phase 18 success criterion #1 ("explicit CI step running on
      # every push to main").
      # NOTE: No step in this workflow passes -p:NuGetAudit=false — the MessagePack
      # advisory (GHSA-hv8m-jj95-wg3x) is eliminated by the 3.1.7 transitive pin, not
      # silenced. The prior -p:NuGetAudit=false workaround is now obsolete.
      - name: Vulnerability scan (SEC-07 gate)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln-report.txt
          if grep -qiE '^\s*(High|Critical)' /tmp/vuln-report.txt; then
            echo "ERROR: HIGH or CRITICAL vulnerability found in dependency graph:" >&2
            grep -iE '^\s*(High|Critical)' /tmp/vuln-report.txt >&2
            exit 1
          fi
          echo "Vulnerability scan passed — no HIGH or CRITICAL advisories found."

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Unit tests (fast, no containers)
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration" --logger "trx" --results-directory TestResults/unit

      - name: Integration tests (Testcontainers)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: dotnet test --no-build --configuration Release --filter "Category=Integration" --logger "trx" --results-directory TestResults/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # benchmarks job — push to main only (PERF-06)
  #
  # This job is intentionally EXCLUDED from pull_request runs:
  #   * Benchmarks take 10+ minutes for the full suite; the fast build-and-test
  #     job (unit + integration) is the PR gate.
  #   * Benchmark results have ±5-15 % CI runner-to-runner variance — running on
  #     every PR would produce noisy feedback without actionable signal.
  #
  # IMPORTANT: Benchmarks NEVER run against an external or production target.
  #   All benchmark I/O is in-process or targets Testcontainers containers
  #   spun up on the CI runner itself.  No BASE_URL, no remote server, no SaaS.
  #
  # Gate activation: the regression gate (CompareBaseline) becomes active once
  # benchmarks/baselines/report-baseline.json is committed (Plan 19-04).
  # Until that file exists, the gate step prints an informational message and
  # skips gracefully rather than hard-failing.
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks + Regression Gate (push-to-main only)
    runs-on: ubuntu-24.04

    # Gate: run only on push events to main — skip on all pull_request events.
    # The existing `on:` block covers both push:main and pull_request:main, so
    # we use a per-job condition to restrict this expensive job to main pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # MinVer needs full tag history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        # NOTE: No -p:NuGetAudit=false — the audit gate remains active.
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Run micro-benchmarks (PERF-01/02)
        # Benchmarks run in Release mode against in-process code + Testcontainers
        # (Redis for the ticket round-trip benchmark).  No external network calls.
        run: |
          dotnet run --project tests/GameKit.LoadTests -c Release -- \
            --filter '*' \
            --exporters json \
            --artifacts BenchmarkRun

      - name: Benchmark regression gate (PERF-06)
        # Compares the emitted -report-full.json against the committed baseline.
        # CompareBaseline exits 1 on any benchmark that regresses >20%, failing
        # the job.  If the baseline file is not yet committed (before Plan 19-04
        # lands), the step prints a clear message and skips gracefully.
        run: |
          REPORT=$(ls BenchmarkRun/results/*-report-full.json 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "WARNING: No benchmark report emitted — benchmark run may have failed."
            exit 1
          fi

          BASELINE="benchmarks/baselines/report-baseline.json"
          if [ ! -f "$BASELINE" ]; then
            echo "INFO: Baseline not yet committed (see Plan 19-04) — skipping regression gate."
            echo "      Commit benchmarks/baselines/report-baseline.json to activate the gate."
            exit 0
          fi

          dotnet run --project benchmarks/CompareBaseline -c Release -- "$REPORT" "$BASELINE"
          # Exit code from CompareBaseline propagates: 0 = pass, 1 = regression.

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkRun/
          retention-days: 30

  pack:
    name: Pack (verify .nupkg output)
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack all packable projects
        run: dotnet pack --configuration Release --output ./artifacts

      - name: Assert expected packages present
        run: |
          ls -la ./artifacts/
          for pkg in GameKit.Core GameKit.Auth GameKit.Rankings GameKit.Matchmaking GameKit.Presence GameKit.Admin.UI GameKit.Cli; do
            if ! ls ./artifacts/${pkg}.*.nupkg 2>/dev/null >/dev/null; then
              echo "ERROR: Missing .nupkg for ${pkg}"
              exit 1
            fi
          done
          echo "All 7 expected packages produced."

      - name: Upload nupkgs
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./artifacts/*.*nupkg
          retention-days: 30
