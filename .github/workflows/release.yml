#
# Release pipeline — runs ONLY on version tags (vX.Y.Z). A repository tag-protection ruleset
# restricts creation of `v*` tags to repo admins, so non-admins cannot trigger this workflow
# (no Action spam). On a tag it:
#   1. builds the Platformer3D demo server image and pushes it to GHCR,
#   2. packs the GameKit.* libraries and pushes them to GitHub Packages,
#   3. creates the GitHub Release (with the easy pull-and-run instructions).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release for the tag
  packages: write   # push the demo image to GHCR + the libraries to GitHub Packages

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build & push demo server image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/noahfreelove/gamekit
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: samples/Platformer3D/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nuget:
    name: Pack & push libraries (nuget.org + GitHub Packages)
    runs-on: ubuntu-latest
    # `environment: release` must match the Environment field of the nuget.org
    # Trusted Publishing policy. The GitHub OIDC token only carries the environment
    # claim when the job declares it, and nuget.org's token exchange checks that claim.
    environment: release
    permissions:
      contents: read
      packages: write   # push the libraries to GitHub Packages
      id-token: write   # mint the GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer derives the version from the full tag history
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack libraries (src/* — GameKit.Build is IsPackable=false and is skipped)
        # No -p:NuGetAudit=false: the MessagePack 3.1.7 pin (Directory.Packages.props)
        # removed GHSA-hv8m-jj95-wg3x, so the SEC-07 audit gate (NuGetAuditMode=all,
        # level=high) packs clean and stays ON to catch any new supply-chain advisory.
        run: |
          for proj in src/*/*.csproj; do
            dotnet pack "$proj" -c Release -o ./artifacts
          done
      # --- nuget.org via Trusted Publishing: OIDC mints a short-lived (1h) key, no stored secret ---
      - name: NuGet login (OIDC → short-lived nuget.org API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: NoahFreelove   # nuget.org profile name (public, not the account email)
      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
      # --- GitHub Packages: kept as a mirror; redundant now that nuget.org is primary ---
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/NoahFreelove/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [image, nuget]
    steps:
      - uses: actions/checkout@v4
      - name: Create / update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## GameKit ${{ github.ref_name }}

            ### Run the demo server (easy setup — no checkout, no build)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/NoahFreelove/gamekit/${{ github.ref_name }}/samples/Platformer3D/docker-compose.release.yml -o docker-compose.yml
            GAMEKIT_TAG=${{ github.ref_name }} docker compose up
            ```
            Open http://localhost:8080 once it's healthy. Admin console: `/admin` — `root` / `platformer-demo-admin`.

            ### Container image
            - `ghcr.io/noahfreelove/gamekit:${{ github.ref_name }}` (also `ghcr.io/noahfreelove/gamekit:latest`)

            ### NuGet packages
            Published to **nuget.org** — install with `dotnet add package GameKit.Core` (likewise
            `GameKit.Auth`, `GameKit.Rankings`, `GameKit.Matchmaking`, `GameKit.Lobby`,
            `GameKit.Presence`, `GameKit.OpenApi`, `GameKit.Admin.UI`, …). Also mirrored to this
            repo's GitHub Packages feed.
          files: |
            samples/Platformer3D/docker-compose.release.yml
