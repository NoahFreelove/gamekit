# docker-compose.yml — GameKit dev stack (Postgres 17.9 + Redis 8.6.2).
# Consumers inherit this as the canonical dev environment shape.
# Production: operators run Postgres + Redis on hardware they control; this file
# is NOT a production recipe — see DIST-05 ops guide (Phase 6).

services:
  postgres:
    image: postgres:17.9
    container_name: gamekit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_bootstrap_dev_only
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - gamekit-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamekit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    shm_size: "256mb"

  redis:
    image: redis:8.6.2
    container_name: gamekit-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory-policy"
      - "noeviction"
      - "--save"
      - "3600 1 300 100 60 10000"
    volumes:
      - gamekit-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  gamekit-postgres-data:
  gamekit-redis-data:
