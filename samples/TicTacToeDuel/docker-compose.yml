# samples/TicTacToeDuel/docker-compose.yml
# Base services for running TicTacToeDuel sample locally.
# Postgres on :5433 (host :5432 reserved for developer's local Postgres).
# Start the sample stack:
#   docker compose -f docker-compose.yml up
# Start with observability overlay:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up

services:
  postgres:
    image: postgres:17.9
    ports:
      - "5433:5432"          # KEY: 5433 on host, not 5432 (host :5432 is the dev's local Postgres)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_bootstrap_dev_only
      POSTGRES_DB: gamekit
    volumes:
      - tictactoe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamekit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8.6.2
    ports:
      - "6379:6379"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory-policy"
      - "noeviction"

volumes:
  tictactoe-postgres-data:
